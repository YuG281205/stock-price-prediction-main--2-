<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NSE Live &middot; Market Watch</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0a0e17;
    --surface: #12182a;
    --surface-raised: #161d33;
    --border: #232b42;
    --text: #e8ecf5;
    --text-dim: #8993ae;
    --text-faint: #576078;
    --accent: #e0a458;
    --accent-dim: #8a6837;
    --up: #3fbf7f;
    --up-bg: rgba(63, 191, 127, 0.12);
    --down: #ff5c6c;
    --down-bg: rgba(255, 92, 108, 0.12);
    --flash: rgba(224, 164, 88, 0.22);
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    height: 100%;
}

::selection { background: var(--accent-dim); color: var(--text); }

.app {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* ---- Header ---- */
header {
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
    flex-shrink: 0;
}

.header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 14px;
}

h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
}
h1 .mark { color: var(--accent); }

.status-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 18px;
}
.status-item { display: flex; align-items: center; gap: 6px; }

.auth-link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.15s;
}
.auth-link:hover {
    color: var(--accent-dim);
}

.pulse-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-faint); flex-shrink: 0;
}
.pulse-dot.live {
    background: var(--up);
    box-shadow: 0 0 0 0 rgba(63,191,127, 0.6);
    animation: pulse 2s infinite;
}
.pulse-dot.down { background: var(--down); }

@keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(63,191,127, 0.55); }
    70%  { box-shadow: 0 0 0 7px rgba(63,191,127, 0); }
    100% { box-shadow: 0 0 0 0 rgba(63,191,127, 0); }
}

.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.search-box { position: relative; flex: 1; min-width: 220px; max-width: 360px; }
.search-box input {
    width: 100%;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px 9px 32px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.15s;
}
.search-box input:focus { border-color: var(--accent-dim); }
.search-box input::placeholder { color: var(--text-faint); }
.search-box svg {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    pointer-events: none;
}

.filter-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 6px 11px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    transition: all 0.12s;
    white-space: nowrap;
}
.filter-chip:hover { border-color: var(--accent-dim); color: var(--text); }
.filter-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #17130a;
    font-weight: 600;
}

.count-badge {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-faint);
}

/* ---- Table ---- */
.table-wrap { flex: 1; overflow: auto; padding: 0 28px 28px; }

table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
}

thead th {
    position: sticky; top: 0;
    background: var(--bg);
    padding: 12px 14px;
    text-align: right;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-faint);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
}
thead th:hover { color: var(--accent); }
thead th:first-child, thead th:nth-child(2) { text-align: left; }
thead th.sorted { color: var(--accent); }
thead th .arrow { font-size: 9px; margin-left: 3px; opacity: 0.8; }

tbody tr {
    border-bottom: 1px solid rgba(35, 43, 66, 0.55);
    transition: background 0.15s;
    cursor: pointer;
    position: relative; /* anchors the hover tooltip */
}
tbody tr:hover { background: var(--surface); }
tbody tr:hover .sym { text-decoration: underline; }
tbody tr.flash { animation: flashrow 0.9s ease-out; }
tbody tr.row-selected {
    background: rgba(224, 164, 88, 0.08);
    box-shadow: inset 2px 0 0 var(--accent);
}

@keyframes flashrow {
    0%   { background: var(--flash); }
    100% { background: transparent; }
}

td { padding: 9px 14px; text-align: right; white-space: nowrap; }
td:first-child, td:nth-child(2) { text-align: left; }

.sym { font-weight: 600; color: var(--text); font-family: 'IBM Plex Mono', monospace; }

.pin-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-faint);
    padding: 0 6px 0 0;
    font-size: 13px; line-height: 1;
    vertical-align: middle;
}
.pin-btn.pinned { color: var(--accent); }

.company {
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
}

.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--text-dim); }

.chg-pill {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
    min-width: 64px;
    text-align: right;
}
.chg-pill.up { background: var(--up-bg); }
.chg-pill.down { background: var(--down-bg); }

.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-faint);
    font-family: 'Inter', sans-serif;
}

.error-banner {
    margin: 0 28px 12px;
    padding: 9px 14px;
    background: var(--down-bg);
    border: 1px solid rgba(255,92,108,0.35);
    border-radius: 6px;
    color: var(--down);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    display: none;
}
.error-banner.show { display: block; }

/* ==========================================================
   ---- Prediction Panel (click a row to open, full detail) ----
   ========================================================== */

.predict-panel {
    margin: 0 28px 16px;
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    display: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
}
.predict-panel.show { display: block; }
.predict-panel h3 {
    margin: 0 0 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    color: var(--text);
}
.predict-loading { color: var(--text-dim); }

.horizon-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.horizon-tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 6px 12px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
}
.horizon-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #17130a;
    font-weight: 600;
}

/* Charts are capped to a fixed, compact height so they read like a
   normal stock-app widget instead of stretching to fill the page. */
.predict-charts {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 18px;
    margin-bottom: 14px;
}
.chart-box {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    height: 200px;       /* hard cap - prevents runaway canvas height */
    max-height: 200px;
    position: relative;
    overflow: hidden;
}
.chart-box canvas {
    max-height: 170px !important;  /* leaves room for the label above it */
}
.chart-box .chart-label {
    font-size: 10.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 6px;
}
.chart-legend {
    display: flex;
    gap: 14px;
    margin-bottom: 4px;
}
.chart-legend .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    color: var(--text-dim);
}
.chart-legend .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
}
#compareChartCanvas {
    max-height: 148px !important; /* leaves room for the legend row above it */
}

.predict-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
}
.predict-stat .label {
    color: var(--text-faint);
    font-size: 10.5px;
    text-transform: uppercase;
}
.predict-stat .value {
    font-size: 15px;
    font-weight: 600;
    margin-top: 2px;
}
.predict-stat .value.signal-buy  { color: var(--up); }
.predict-stat .value.signal-sell { color: var(--down); }
.predict-stat .value.signal-hold { color: var(--text-dim); }

.predict-note { margin-top: 12px; color: var(--text-faint); font-size: 11px; }

/* ==========================================================
   ---- Hover tooltip (quick preview, no click needed) ----
   ========================================================== */

.hover-tooltip {
    position: fixed;
    z-index: 50;
    min-width: 190px;
    padding: 10px 12px;
    background: var(--surface-raised);
    border: 1px solid var(--accent-dim);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text);
    pointer-events: none;
    display: none;
}
.hover-tooltip.show { display: block; }
.hover-tooltip .ht-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
}
.hover-tooltip .ht-row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 2px 0;
    color: var(--text-dim);
}
.hover-tooltip .ht-row .ht-val { color: var(--text); font-weight: 600; }
.hover-tooltip .ht-row .ht-val.signal-buy  { color: var(--up); }
.hover-tooltip .ht-row .ht-val.signal-sell { color: var(--down); }
.hover-tooltip .ht-row .ht-val.signal-hold { color: var(--text-dim); }
.hover-tooltip .ht-hint {
    margin-top: 6px;
    color: var(--text-faint);
    font-size: 10px;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

a:focus-visible, button:focus-visible, input:focus-visible, th:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

@media (max-width: 720px) {
    header { padding: 16px 16px 12px; }
    .table-wrap { padding: 0 8px 20px; }
    .company { display: none; }
    .predict-charts { grid-template-columns: 1fr; }
    .hover-tooltip { display: none !important; } /* tooltip needs a mouse; touch devices use click instead */
}
</style>
</head>

<body>
<div class="app">
  <header>
    <div class="header-top">
      <h1><img src="favicon.svg" alt="Logo" style="width:26px; height:26px; vertical-align:middle; margin-right:6px; border-radius:4px;"> NSE Live <span style="color:var(--text-faint); font-weight:500; font-size:15px; margin-left:4px;">/ Market Watch</span></h1>
      <div class="status-line">
        <div class="status-item"><span id="pulseDot" class="pulse-dot"></span><span id="connStatus">connecting&hellip;</span></div>
        <div class="status-item">updated <span id="lastUpdated">&mdash;</span></div>
        <div class="status-item"><span id="indexName">NIFTY 500</span></div>
        <div class="status-item" id="authSection" style="margin-left: 8px;">
          <!-- Managed by JS -->
        </div>
      </div>
    </div>
    <div class="controls">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Search symbol or company&hellip; (e.g. RELIANCE, ADANI)" autocomplete="off" />
      </div>
      <div id="chipPinned" class="filter-chip">&#9733; Pinned</div>
      <div id="chipGainers" class="filter-chip">Gainers</div>
      <div id="chipLosers" class="filter-chip">Losers</div>
      <div class="count-badge"><span id="visibleCount">0</span> / <span id="totalCount">0</span> symbols</div>
    </div>
  </header>

  <div id="errorBanner" class="error-banner"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-key="pin" style="width:26px;"></th>
          <th data-key="symbol">Symbol</th>
          <th data-key="companyName">Company</th>
          <th data-key="lastPrice">LTP</th>
          <th data-key="change">Chg</th>
          <th data-key="pChange">% Chg</th>
          <th data-key="dayHigh">High</th>
          <th data-key="dayLow">Low</th>
          <th data-key="totalTradedVolume">Volume</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="9" class="empty-state">
            <div style="display:flex; justify-content:center; align-items:center; gap:8px; margin: 40px 0;">
                <div class="pulse-dot live" style="width:10px; height:10px;"></div>
                <span>Syncing live market data&hellip;</span>
            </div>
        </td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Hover tooltip element - positioned/filled by predict-widget.js -->
<div id="hoverTooltip" class="hover-tooltip"></div>

<script src="toast.js"></script>
<script>
  // ---------------------------------------------------------------
  // Auth Check
  // ---------------------------------------------------------------
  const token = localStorage.getItem('token');
  if (!token) {
      window.location.replace('index.html');
  }
  
  const authSection = document.getElementById('authSection');
  const userName = localStorage.getItem('user_name') || 'Trader';
  authSection.innerHTML = `<span style="color:var(--text-dim);">Welcome, ${userName}</span> &middot; <a href="#" id="logoutBtn" class="auth-link">Logout</a>`;
  
  document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('token');
      localStorage.removeItem('user_name');
      window.location.href = 'index.html';
  });

  // ---------------------------------------------------------------
  // State
  // ---------------------------------------------------------------
  let rows = [];              // latest raw rows from server
  let prevPrices = {};        // symbol -> last lastPrice, for flash-on-change
  let pinned = new Set();     // populated from DB
  let sortKey = "pChange";
  let sortDir = -1;           // -1 desc, 1 asc
  let filterMode = null;      // 'pinned' | 'gainers' | 'losers' | null
  let searchTerm = "";
  let lastUpdatedTs = null;

  const tbody = document.getElementById("tbody");
  const connStatus = document.getElementById("connStatus");
  const pulseDot = document.getElementById("pulseDot");
  const lastUpdatedEl = document.getElementById("lastUpdated");
  const indexNameEl = document.getElementById("indexName");
  const errorBanner = document.getElementById("errorBanner");
  const visibleCountEl = document.getElementById("visibleCount");
  const totalCountEl = document.getElementById("totalCount");

  // ---------------------------------------------------------------
  // Field helpers — tolerant of slightly different NSE field shapes
  // ---------------------------------------------------------------
  function num(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : null; }
  function getSymbol(r) { return r.symbol || r.Symbol || "-"; }
  function getCompany(r) { return (r.meta && r.meta.companyName) || r.companyName || r.symbol || "-"; }
  function getLTP(r) { return num(r.lastPrice ?? r.ltp ?? r.close); }
  function getChange(r) { return num(r.change); }
  function getPChange(r) { return num(r.pChange ?? r.perChange); }
  function getHigh(r) { return num(r.dayHigh); }
  function getLow(r) { return num(r.dayLow); }
  function getVolume(r) { return num(r.totalTradedVolume ?? r.tradedQuantity); }

  function fmtNum(v, digits = 2) {
    if (v === null || v === undefined) return "-";
    return v.toLocaleString("en-IN", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
  function fmtVol(v) {
    if (v === null || v === undefined) return "-";
    if (v >= 1e7) return (v / 1e7).toFixed(2) + "Cr";
    if (v >= 1e5) return (v / 1e5).toFixed(2) + "L";
    if (v >= 1e3) return (v / 1e3).toFixed(1) + "K";
    return String(v);
  }

  // ---------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------
  function applyFilterAndSort() {
    let out = rows;

    if (filterMode === "pinned") {
      out = out.filter(r => pinned.has(getSymbol(r)));
    } else if (filterMode === "gainers") {
      out = out.filter(r => (getPChange(r) ?? 0) > 0);
    } else if (filterMode === "losers") {
      out = out.filter(r => (getPChange(r) ?? 0) < 0);
    }

    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      out = out.filter(r =>
        getSymbol(r).toLowerCase().includes(q) ||
        getCompany(r).toLowerCase().includes(q)
      );
    }

    const keyFn = {
      symbol: getSymbol, companyName: getCompany, lastPrice: getLTP,
      change: getChange, pChange: getPChange, dayHigh: getHigh,
      dayLow: getLow, totalTradedVolume: getVolume,
    }[sortKey] || getPChange;

    out = [...out].sort((a, b) => {
      const va = keyFn(a), vb = keyFn(b);
      if (typeof va === "string") return sortDir * va.localeCompare(vb);
      return sortDir * (((va ?? -Infinity)) - ((vb ?? -Infinity)));
    });

    if (filterMode !== "pinned") {
      out.sort((a, b) => (pinned.has(getSymbol(b)) ? 1 : 0) - (pinned.has(getSymbol(a)) ? 1 : 0));
    }

    return out;
  }

  function render() {
    const list = applyFilterAndSort();
    visibleCountEl.textContent = list.length;
    totalCountEl.textContent = rows.length;

    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" class="empty-state">No symbols match.</td></tr>`;
      return;
    }

    const frag = document.createDocumentFragment();
    for (const r of list) {
      const sym = getSymbol(r);
      const ltp = getLTP(r);
      const chg = getChange(r);
      const pchg = getPChange(r);
      const dirClass = pchg > 0 ? "up" : pchg < 0 ? "down" : "flat";
      const sign = pchg > 0 ? "+" : "";

      const tr = document.createElement("tr");
      const prev = prevPrices[sym];
      if (prev !== undefined && ltp !== null && prev !== ltp) {
        tr.classList.add("flash");
      }

      tr.innerHTML = `
        <td><button class="pin-btn ${pinned.has(sym) ? "pinned" : ""}" data-sym="${sym}">${pinned.has(sym) ? "&#9733;" : "&#9734;"}</button></td>
        <td class="sym">${sym}</td>
        <td class="company" title="${getCompany(r)}">${getCompany(r)}</td>
        <td>${fmtNum(ltp)}</td>
        <td class="${dirClass}">${chg !== null ? sign + fmtNum(chg) : "-"}</td>
        <td><span class="chg-pill ${dirClass}">${pchg !== null ? sign + fmtNum(pchg) + "%" : "-"}</span></td>
        <td class="flat">${fmtNum(getHigh(r))}</td>
        <td class="flat">${fmtNum(getLow(r))}</td>
        <td class="flat">${fmtVol(getVolume(r))}</td>
      `;
      frag.appendChild(tr);
      if (ltp !== null) prevPrices[sym] = ltp;
    }
    tbody.innerHTML = "";
    tbody.appendChild(frag);
  }

  // ---------------------------------------------------------------
  // Header sort clicks
  // ---------------------------------------------------------------
  document.querySelectorAll("thead th[data-key]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (key === "pin") return;
      if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = -1; }
      document.querySelectorAll("thead th").forEach(h => { h.classList.remove("sorted"); h.querySelector(".arrow")?.remove(); });
      th.classList.add("sorted");
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = sortDir === 1 ? "&#9650;" : "&#9660;";
      th.appendChild(arrow);
      render();
    });
  });

  // Pin toggle (event delegation)
  tbody.addEventListener("click", async e => {
    const btn = e.target.closest(".pin-btn");
    if (!btn) return;
    const sym = btn.dataset.sym;
    
    // Optimistic update
    const wasPinned = pinned.has(sym);
    if (wasPinned) pinned.delete(sym);
    else pinned.add(sym);
    render();

    try {
      const res = await fetch('/api/auth/watchlist', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ symbol: sym })
      });
      if (!res.ok) throw new Error("Failed to sync watchlist");
    } catch (err) {
      showToast(err.message, 'error');
      // Revert on failure
      if (wasPinned) pinned.add(sym);
      else pinned.delete(sym);
      render();
    }
  });

  document.getElementById("searchInput").addEventListener("input", e => {
    searchTerm = e.target.value.trim();
    render();
  });

  function setFilter(mode) {
    filterMode = filterMode === mode ? null : mode;
    document.getElementById("chipPinned").classList.toggle("active", filterMode === "pinned");
    document.getElementById("chipGainers").classList.toggle("active", filterMode === "gainers");
    document.getElementById("chipLosers").classList.toggle("active", filterMode === "losers");
    render();
  }
  document.getElementById("chipPinned").addEventListener("click", () => setFilter("pinned"));
  document.getElementById("chipGainers").addEventListener("click", () => setFilter("gainers"));
  document.getElementById("chipLosers").addEventListener("click", () => setFilter("losers"));

  // ---------------------------------------------------------------
  // Connection status / relative time ticker
  // ---------------------------------------------------------------
  function setConnected(ok) {
    pulseDot.className = "pulse-dot " + (ok ? "live" : "down");
    connStatus.textContent = ok ? "live" : "disconnected — retrying";
  }

  function relTime(iso) {
    if (!iso) return "-";
    const secs = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (secs < 2) return "just now";
    if (secs < 60) return secs + "s ago";
    return Math.floor(secs / 60) + "m ago";
  }
  setInterval(() => { lastUpdatedEl.textContent = relTime(lastUpdatedTs); }, 1000);

  // ---------------------------------------------------------------
  // WebSocket with polling fallback
  // ---------------------------------------------------------------
  function handlePayload(msg) {
    if (msg.type === "update") {
      rows = msg.data || [];
      lastUpdatedTs = msg.last_updated;
      if (msg.index) indexNameEl.textContent = msg.index;
      errorBanner.classList.remove("show");
      render();
    } else if (msg.type === "error") {
      errorBanner.textContent = "Feed warning: " + msg.message;
      errorBanner.classList.add("show");
    }
  }

  function connectWS() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => setConnected(true);
    ws.onmessage = (ev) => { try { handlePayload(JSON.parse(ev.data)); } catch (e) { console.error(e); } };
    ws.onclose = () => { setConnected(false); setTimeout(connectWS, 3000); };
    ws.onerror = () => ws.close();
  }

  async function pollFallback() {
    try {
      const res = await fetch("/api/stocks");
      const msg = await res.json();
      handlePayload({ type: "update", data: msg.data, last_updated: msg.last_updated, index: msg.index });
      setConnected(true);
    } catch (e) {
      setConnected(false);
    }
  }

  async function initApp() {
    try {
      const res = await fetch('/api/auth/watchlist', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        pinned = new Set(data.watchlist);
        render();
      }
    } catch (e) {
      console.error("Watchlist fetch failed", e);
    }

    if ("WebSocket" in window) {
      connectWS();
    } else {
      pollFallback();
      setInterval(pollFallback, 5000);
    }
  }

  initApp();
</script>
<script src="predict-widget.js?v=5"></script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login &middot; NSE Live</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0a0e17;
    --surface: #12182a;
    --surface-raised: #161d33;
    --border: #232b42;
    --text: #e8ecf5;
    --text-dim: #8993ae;
    --text-faint: #576078;
    --accent: #e0a458;
    --accent-dim: #8a6837;
    --up: #3fbf7f;
    --up-bg: rgba(63, 191, 127, 0.12);
    --down: #ff5c6c;
    --down-bg: rgba(255, 92, 108, 0.12);
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

::selection { background: var(--accent-dim); color: var(--text); }

.auth-container {
    width: 100%;
    max-width: 400px;
    padding: 36px 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
}

h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 8px 0;
    text-align: center;
}

h1 .mark { color: var(--accent); }

.subtitle {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 32px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
}

.form-group input {
    width: 100%;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
}

.form-group input:focus {
    border-color: var(--accent-dim);
}

.form-group input::placeholder {
    color: var(--text-faint);
}

.auth-btn {
    width: 100%;
    background: var(--accent);
    color: #17130a;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 12px;
}

.auth-btn:hover {
    background: #f0b468;
}

.footer-link {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: var(--text-dim);
}

.footer-link a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
}

.footer-link a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>

<div class="auth-container">
    <h1><img src="favicon.svg" alt="Logo" style="width:28px; height:28px; vertical-align:middle; margin-right:8px; border-radius:6px;"> NSE Live</h1>
    <div class="subtitle">Welcome back! Please login to your account.</div>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required autocomplete="email" />
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
        </div>
        
        <button type="submit" class="auth-btn">Login</button>
    </form>
    
    <div class="footer-link">
        Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
</div>

</body>
<script src="toast.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.textContent = 'Logging in...';
    btn.disabled = true;

    const formData = new URLSearchParams();
    formData.append('username', document.getElementById('email').value);
    formData.append('password', document.getElementById('password').value);

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        });

        const data = await res.json();
        
        if (res.ok) {
            localStorage.setItem('token', data.access_token);
            localStorage.setItem('user_name', data.name);
            showToast('Welcome back, ' + data.name + '!', 'success');
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
        } else {
            showToast(data.detail || 'Login failed', 'error');
            btn.textContent = 'Login';
            btn.disabled = false;
        }
    } catch (err) {
        showToast('Network error. Please try again.', 'error');
        btn.textContent = 'Login';
        btn.disabled = false;
    }
});
</script>
</html>
